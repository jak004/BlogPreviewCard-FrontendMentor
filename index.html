<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive blog preview card built from scratch.">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  <title>Blog Preview Card</title>
</head>
<body>
  <main class="page">
    <article class="card">
      <img
        class="card__image"
        src="./assets/images/illustration-article.svg"
        alt="Abstract black, white and yellow geometric illustration"
      >

      <div class="card__content">
        <span class="card__tag">Learning</span>

        <p class="card__date">Published 21 Dec 2023</p>

        <h1 class="card__title">
          <a href="#" aria-label="Read HTML and CSS foundations article">HTML &amp; CSS foundations</a>
        </h1>

        <p class="card__description">
          These languages are the backbone of every website, defining structure, content, and presentation.
        </p>

        <div class="author">
          <img class="author__avatar" src="./assets/images/image-avatar.webp" alt="">
          <span class="author__name">Greg Hooper</span>
        </div>
      </div>
    </article>
  </main>
</body>
</html>
